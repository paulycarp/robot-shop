# Helm values for kube-prometheus-stack
# Designed for the Capstone 2 observability stack

grafana:
  adminPassword: "admin"
  service:
    type: NodePort
    nodePort: 30000
  defaultDashboardsEnabled: true
  livenessProbe:
    initialDelaySeconds: 300
    failureThreshold: 30
    periodSeconds: 10
  readinessProbe:
    initialDelaySeconds: 60
    failureThreshold: 30
    periodSeconds: 10

prometheus:
  service:
    type: NodePort
    nodePort: 30900
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

alertmanager:
  service:
    type: ClusterIP
